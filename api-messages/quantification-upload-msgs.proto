syntax = "proto3";
option go_package = ".;protos";


/* Originals:
-POST /quantification/upload/<datasetID>
*/

// Uploading quantified data as a CSV
// NOTE: this expects the same format as we export, with the filename column
// being used to determine which detector we're reading

// requires(QUANTIFY)
message QuantUploadReq
{
    string scanId = 1;
    string name = 2;
    string comments = 3;
    //bool isCombined = 4;
    string csvData = 5;
}

message QuantUploadResp
{
    string createdQuantId = 1;
}


// Importing an uploaded large image as a quantification. This expects a floating point tif image and imports
// it as a quantification with the ability to skip rows/columns to reduce the data size if needed

// requires(QUANTIFY)
message QuantImportReq
{
    string scanId = 1;
    string name = 2;
    string comments = 3;
    string uploadedFileName = 5;
}

message QuantImportResp
{
    string createdQuantId = 1;
}
